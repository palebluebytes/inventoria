<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>does a food have forms? (PROTOTYPE)</title>
    <!--
      PROTOTYPE. The styles live here rather than in a .css file under src/ on
      purpose: stylelint globs `src/**/*.{css,svelte}` and enforces the app's
      brutalist token rules, and a throwaway has no business either satisfying
      or relaxing them. The app's own tokens still arrive — main.ts imports
      src/app.css — so the shapes are judged in the app's type and spacing
      rather than in a mock's.
    -->
    <style>
      body {
        max-width: 62rem;
        margin: 0 auto;
        padding: var(--space-s) var(--space-s) var(--space-3xl);
      }
      h1 {
        font-size: var(--step-2);
        line-height: 1.1;
      }
      .title {
        display: flex;
        align-items: baseline;
        gap: var(--space-2xs);
        flex-wrap: wrap;
      }
      .ticket {
        font-size: var(--step-n2);
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .foods {
        display: flex;
        gap: var(--space-3xs);
        flex-wrap: wrap;
        margin: var(--space-xs) 0 var(--space-2xs);
      }
      .food,
      .opt,
      .shape {
        font: inherit;
        background: var(--paper);
        border: var(--edge);
        border-radius: var(--radius);
        padding: var(--space-3xs) var(--space-2xs);
        cursor: pointer;
        min-height: 2.75rem;
      }
      .food-on,
      .opt-on {
        background: var(--ink);
        color: var(--paper);
      }
      .why {
        font-size: var(--step-n1);
        color: var(--text-secondary);
        max-width: 46rem;
        margin-bottom: var(--space-xs);
      }
      .dial {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        flex-wrap: wrap;
        border: var(--edge);
        padding: var(--space-2xs);
        background: var(--bg-surface);
        font-size: var(--step-n1);
      }
      .dial-off {
        opacity: 0.45;
      }
      .dial input {
        flex: 1 1 14rem;
      }
      .dial-value {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        min-width: 3ch;
      }
      .dial-note {
        font-size: var(--step-n2);
        color: var(--text-secondary);
      }

      .strip {
        display: flex;
        align-items: baseline;
        gap: var(--space-2xs);
        flex-wrap: wrap;
        margin: var(--space-s) 0 var(--space-xs);
        font-size: var(--step-n2);
      }
      .strip-label {
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .chips {
        display: flex;
        gap: var(--space-3xs);
        flex-wrap: wrap;
      }
      .axis {
        border: var(--edge-thin);
        padding: 0.1rem var(--space-3xs);
        white-space: nowrap;
      }
      .axis-kept {
        border: var(--edge);
        background: var(--green-bg);
      }
      .axis-decided {
        color: var(--text-secondary);
        text-decoration: line-through;
      }
      .axis-unmeasured {
        background: var(--amber-bg);
      }

      .lede {
        font-size: var(--step-n1);
        max-width: 46rem;
        margin-bottom: var(--space-xs);
      }
      .tally {
        display: flex;
        gap: var(--space-2xs);
        align-items: baseline;
        margin-bottom: var(--space-2xs);
      }
      .tally-lost,
      .row-merged {
        color: var(--red-text);
        font-size: var(--step-n2);
      }
      .rows {
        list-style: none;
        border: var(--edge);
        background: var(--bg-surface);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0 var(--space-2xs);
        padding: var(--space-2xs);
        border-bottom: var(--edge-thin);
        cursor: pointer;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row-hole {
        background: var(--amber-bg);
        cursor: default;
      }
      .row-chosen {
        background: var(--highlight-bg);
      }
      .row-kcal {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .row-merged {
        grid-column: 1 / -1;
      }

      .split + .split {
        margin-top: var(--space-s);
      }
      .rows-nested {
        border-top: 0;
      }
      .ingredient {
        font-size: var(--step-1);
        font-weight: 700;
        border: var(--edge);
        border-bottom: 0;
        background: var(--bg-surface);
        padding: var(--space-2xs);
      }
      .forms {
        border: var(--edge);
        background: var(--bg-surface);
        padding: var(--space-2xs);
        display: grid;
        gap: var(--space-2xs);
      }
      .form-label {
        font-size: var(--step-n2);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
      }
      .form-measure {
        font-variant-numeric: tabular-nums;
      }
      .form-options {
        display: flex;
        gap: var(--space-3xs);
        flex-wrap: wrap;
        margin-top: var(--space-3xs);
      }
      .opt-hollow {
        border-style: dashed;
        color: var(--text-muted);
      }

      .panel {
        border: var(--edge);
        border-top: 0;
        background: var(--bg-surface);
        padding: var(--space-2xs);
        box-shadow: var(--shadow-1);
      }
      .panel-unpicked {
        color: var(--text-secondary);
        font-style: italic;
      }
      .panel-empty {
        background: var(--red-bg);
        border-top: var(--edge);
        margin-top: var(--space-2xs);
      }
      .panel-name {
        font-size: var(--step-n1);
        color: var(--text-secondary);
        margin-bottom: var(--space-3xs);
      }
      .panel-figures {
        display: flex;
        gap: var(--space-xs);
        flex-wrap: wrap;
        font-variant-numeric: tabular-nums;
      }
      .panel-stands,
      .basis {
        font-size: var(--step-n2);
        color: var(--text-secondary);
      }

      .hollow {
        margin-top: var(--space-2xs);
        font-size: var(--step-n1);
        border-left: var(--edge-thick);
        padding-left: var(--space-2xs);
      }
      .hollow-bad {
        background: var(--amber-bg);
      }
      .decided,
      .corpus {
        margin-top: var(--space-2xs);
        font-size: var(--step-n1);
      }
      .decided ul,
      .corpus ul {
        margin: var(--space-3xs) 0 0 var(--space-s);
      }
      .corpus li {
        font-family: var(--font-mono);
        font-size: var(--step-n2);
      }
      .note {
        font-size: var(--step-n2);
        color: var(--text-secondary);
        margin-top: var(--space-3xs);
      }

      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--paper);
        border-top: var(--edge);
      }
      .shapes {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3xs);
        padding: var(--space-3xs);
        max-width: 62rem;
        margin: 0 auto;
      }
      .shape {
        flex: 1;
        display: grid;
        text-align: left;
        gap: 0.1rem;
      }
      .shape span {
        font-size: var(--step-n2);
        color: var(--text-secondary);
      }
      .shape-on {
        background: var(--ink);
        color: var(--paper);
      }
      .shape-on span {
        color: var(--paper);
      }
    </style>
  </head>
  <body>
    <div id="app">loading the search index…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
