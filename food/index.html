<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Rations' own mark (#302), not Inventoria's: this page installs under
         it, and the two Facets are not the same app. It is a raster because the
         drawing is one, and it is opaque because the drawing is black line art
         that vanishes on a dark composite — docs/icon-provenance.md measures
         both. Neither size is a manifest icon: these two are where a browser
         looks for a tab favicon and an iOS Home Screen clip, and the three the
         manifest enumerates are in the Facet registry. The manifest link itself
         is not here either — `facetManifests` in vite.config.ts writes it, in
         place of the root's, which VitePWA injects into every entry and which
         would offer an install of the other Facet (#305). -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/food/icons/rations-32.png"
    />
    <link rel="apple-touch-icon" href="/food/icons/rations-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Replaced on mount from the Facet registry, like the root's. Still
         reading this is the symptom the offline spec looks for. -->
    <title>temp-init</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/food-main.ts"></script>
  </body>
</html>
