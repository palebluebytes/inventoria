name = "inventoria"

# **Which origin the app is** (#294, decided on #276 §4.3). This is the single
# most consequential deploy setting in the repo, because an origin decides the
# OPFS jar: move it and every installed copy must be re-installed, and its
# ledger does not follow. It sits here rather than in the dashboard for exactly
# that reason — the build command and env vars are dashboard configuration and
# do not determine the jar, this does, and dashboard-only settings have already
# cost one retraction (ADR-0070).
#
# `inventoria.palebluebytes.space` rather than a `workers.dev` hostname because
# the #267 map's driver is identity, "the thing you would link someone to". The
# zone is already Cloudflare's and already carries a sibling project at
# `push.palebluebytes.space`, so the convention is joined rather than invented.
#
# Rations' vanity host is a **sibling**, `rations.palebluebytes.space`, never a
# subdomain of this one: a TLS wildcard matches one label and stops, so
# `*.palebluebytes.space` covers the sibling while `rations.inventoria.…` would
# need Advanced Certificate Manager. It is a zone Single Redirect rule rather
# than a route here, which keeps the vanity host out of `worker/src/index.ts`,
# whose 404 arm is already load-bearing for "matched no asset" (#312).
routes = [{ pattern = "inventoria.palebluebytes.space", custom_domain = true }]

# Off in the **same change** that adds the custom domain above, never after it.
# Left on, the app is served on two origins at once, permanently: two OPFS jars,
# two installable copies, and an existing install silently keeping a ledger the
# new origin cannot see. That is the outcome #267's decision 2 refused, arrived
# at by nobody choosing it.
#
# Off rather than redirected. A redirect needs the Worker to keep answering on
# the old hostname, which keeps the second origin alive in order to serve it.
#
# Whoever turns this back on for a quick preview URL is turning that on too.
workers_dev = false

# The proxy runs as part of this Worker rather than beside it. It was its own
# `inventoria-proxy` deployment with its own toolchain until 2026-08-28, and
# nothing was routing to it — `.env.example` has always pointed the app at a
# same-origin `/api/proxy`, which an assets-only Worker had no way to answer.
# Same origin also means the scraped bytes come back under the app's own COEP,
# with no cross-origin resource policy to satisfy.
#
# The platform serves a matching static asset without invoking this at all
# (`run_worker_first` defaults off), so the script only sees `/api/proxy` and
# whatever matched no asset. No `binding` here on purpose: the Worker never
# needs to fetch an asset itself.
main = "worker/src/index.ts"

# The ceiling is the bundled runtime's own date: wrangler 4.126.0 ships
# workerd 1.20260825.1, and workerd's version *is* the newest compatibility
# date it understands. Raising this past that date breaks `wrangler dev`
# locally even though the deployed runtime would accept it, so the two move
# together — bump wrangler, then bump this to match.
compatibility_date = "2026-08-25"

[assets]
directory = "dist"

# The relay (ADR-0072). It is another route on this script rather than its own
# Worker, deliberately: a second Worker means a second dashboard-configured
# build that nothing in this repo records, which is exactly the failure
# ADR-0070 was written to end. Same origin is also worth something here, since
# the receive link and the socket then share the app's origin.
#
# SQLite-backed because that is the only storage class a new Durable Object
# gets; the room uses it for the hibernation attachments and the five-minute
# sweep alarm and for nothing else, and clears both when the room closes.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# `enabled` here is the switch for observability as a whole; the per-signal
# blocks below say which signals are actually wanted. This used to read
# `enabled = false` under blocks that turned logs on, which left the outcome
# resting on which of the two the server lets win — a question wrangler does
# not answer, since it forwards both values untouched. Logs on and traces off
# is what the sub-blocks already asked for; now the top says so too.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true

# Off since the relay landed, and the proxy pays for it (ADR-0072 §9).
#
# An invocation log is an automatic per-request record, and for the relay each
# one would say that two devices met, when, and from where — precisely the
# persistent, learnable thing ADR-0072 §8 forbids and §12 keeps the room's own
# storage empty to avoid. Observability is configured per *script*, not per
# route, and a Durable Object is defined in the script, so there is no separate
# switch to turn: the whole script goes quiet or none of it does.
#
# `enabled = true` above stays, so `console.log` still works for the proxy; it
# is only the automatic record that goes. `scripts/worker-closure-check.mjs`
# holds the other half, failing the build if the relay itself reaches for the
# console.
#
# Cloudflare's docs do not say whether an invocation log carries the client IP.
# This posture makes the question moot, which is the argument for it under
# uncertainty — and anyone proposing to switch this back on has to answer that
# question first.
invocation_logs = false

# `persist` and `head_sampling_rate` went with the disable: they only ever
# described how to record traces that are not being recorded.
[observability.traces]
enabled = false
