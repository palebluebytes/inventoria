name = "inventoria"

# The proxy runs as part of this Worker rather than beside it. It was its own
# `inventoria-proxy` deployment with its own toolchain until 2026-08-28, and
# nothing was routing to it — `.env.example` has always pointed the app at a
# same-origin `/api/proxy`, which an assets-only Worker had no way to answer.
# Same origin also means the scraped bytes come back under the app's own COEP,
# with no cross-origin resource policy to satisfy.
#
# The platform serves a matching static asset without invoking this at all
# (`run_worker_first` defaults off), so the script only sees `/api/proxy` and
# whatever matched no asset. No `binding` here on purpose: the Worker never
# needs to fetch an asset itself.
main = "worker/src/index.ts"

# The ceiling is the bundled runtime's own date: wrangler 4.126.0 ships
# workerd 1.20260825.1, and workerd's version *is* the newest compatibility
# date it understands. Raising this past that date breaks `wrangler dev`
# locally even though the deployed runtime would accept it, so the two move
# together — bump wrangler, then bump this to match.
compatibility_date = "2026-08-25"

[assets]
directory = "dist"

# `enabled` here is the switch for observability as a whole; the per-signal
# blocks below say which signals are actually wanted. This used to read
# `enabled = false` under blocks that turned logs on, which left the outcome
# resting on which of the two the server lets win — a question wrangler does
# not answer, since it forwards both values untouched. Logs on and traces off
# is what the sub-blocks already asked for; now the top says so too.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# `persist` and `head_sampling_rate` went with the disable: they only ever
# described how to record traces that are not being recorded.
[observability.traces]
enabled = false
