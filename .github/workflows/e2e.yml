# The Playwright suite. It used to run in .husky/pre-push; it runs here instead,
# so a push is not held hostage to a slow browser suite on the dev machine.
#
# The job enters `nix develop .#ci`, the trimmed sibling of the shell developers
# get: ADR-0012 pins the Playwright browsers to nixpkgs via flake.lock, so CI and
# a workstation drive the same Chromium build.
name: e2e

on:
  push:
    # Documentation is markdown-only and `pnpm check` already gates its structure
    # at commit time, so a docs-only push has nothing here to prove. GitHub skips
    # the run only when every changed path matches, so a commit touching both a
    # spec and an ADR still runs.
    paths-ignore:
      - "**.md"
      - "docs/**"

  # Visual baselines belong to the machine that checks them: fonts and rendering
  # differ between this runner and a NixOS workstation, so a snapshot captured
  # locally is not the one CI compares against. Run this workflow by hand with
  # `update-snapshots` on, then commit the artifact it uploads.
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Rebaseline the visual snapshots on this runner and upload them"
        type: boolean
        default: false

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The job reads the repo and deletes its own stale caches. Nothing else.
#
# `actions: write` is what the `purge` block below needs: deleting a cache is a
# REST call the read-only default token cannot make, so without this the purge
# fails with "Resource not accessible by integration" in a post step, after the
# suite has already passed. A green run and a purge that never happened look the
# same from the outside, which is how one dead 562MB cache sat here since
# 2026-08-17. The repository default is read (`actions/permissions/workflow`), so
# the grant has to be written out; naming `contents` alongside it is not optional
# either, because declaring this key at all drops every scope left out of it.
permissions:
  contents: read
  actions: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The suite is serial by design (playwright.config.ts sets workers: 1) and
    # retries twice on CI, so give it room without letting a hang burn an hour.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Restores /nix, so the CI shell closure — Chromium is the bulk of it — is
      # not refetched from cache.nixos.org on every push. Must run after Nix is
      # installed and before anything evaluates the flake.
      #
      # The key tracks the flake alone: the closure changes when flake.lock moves
      # or flake.nix gains a package, and at no other time. On a miss it falls
      # back to the newest cache for this runner and tops that up, which keeps a
      # lockfile bump incremental rather than a cold start.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # The CI shell closes over ~1GB. Cap well above that so a normal run
          # never collects, while a runaway cannot eat the 10GB repository budget
          # this shares with the pnpm store below.
          gc-max-store-size-linux: 3G
          # Keep one cache per runner: purge the older entries this prefix matches
          # and leave the key just written alone.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Restore the pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile

      # GitHub sets CI=true, which playwright.config.ts already reads: it forbids
      # test.only, retries twice, and starts its own dev server rather than
      # reusing one. No CI-specific flags belong here.
      - name: Run the Playwright suite
        if: ${{ !inputs.update-snapshots }}
        run: nix develop .#ci --command pnpm test:e2e

      # A separate config and its own production build (see
      # playwright.offline.config.ts). It guards a cold offline start, which the
      # main suite structurally cannot: that one runs `pnpm dev`, which registers
      # no service worker.
      - name: Run the offline-boot spec
        if: ${{ !inputs.update-snapshots }}
        run: nix develop .#ci --command pnpm test:e2e:offline

      # `playwright` directly rather than through `pnpm test:e2e`, so the flag
      # reaches Playwright rather than pnpm. Bare `--update-snapshots` presets to
      # `changed`: it rewrites the baselines that differ and leaves the rest.
      - name: Rebaseline the visual snapshots
        if: ${{ inputs.update-snapshots }}
        run: nix develop .#ci --command pnpm exec playwright test --update-snapshots

      - name: Upload the rebaselined snapshots
        if: ${{ inputs.update-snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: tests/*-snapshots/
          retention-days: 7
          if-no-files-found: error

      # Traces (trace: on-first-retry) and visual diffs land in test-results/.
      # Without them a red run tells you nothing a local re-run could not.
      - name: Upload traces and visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
